<svg width="480" height="130" viewBox="0 0 480 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkBlueArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <linearGradient id="darkRoad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF9A3D" />
      <stop offset="100%" stopColor="#FF7A00" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate (Optional) -->
  <rect width="480" height="130" rx="16" fill="#083091" />

  <!-- 1. Emblem Group -->
  <g transform="translate(15, 12) scale(1.05)">
    <!-- Upper Blue Arc -->
    <path
      d="M 23 44 C 21 24, 38 10, 62 10 C 74 10, 85 15, 92 23 C 94 25, 93 28, 90 28 C 76 28, 62 23, 48 27 C 34 31, 26 40, 23 44 Z"
      fill="url(#darkBlueArc)"
    />

    <!-- Ascending Airplane -->
    <g transform="translate(68, 8) rotate(-10)">
      <path
        d="M 12 14 L 20 7 C 22 5, 25 5, 26 7 L 27 10 L 37 13 C 38 13.5, 38 15, 36.5 15.5 L 26.5 15.5 L 21 24 C 20.5 24.5, 19.5 24.5, 19.5 23.5 L 20.5 16.5 L 13.5 17 L 11 20 C 10.5 20.5, 9.8 20.3, 9.8 19.7 L 10.5 16.5 L 8.5 15.5 C 7.5 15, 7.5 14, 8.5 13.5 L 12 14 Z"
        fill="#38BDF8"
      />
    </g>

    <!-- Sweeping Highway / Road -->
    <path
      d="M 16 48 C 12 66, 26 88, 54 90 C 70 91, 84 84, 94 72 C 90 73, 80 77, 68 76 C 45 74, 31 62, 28 47 Z"
      fill="url(#darkRoad)"
    />

    <!-- White Broken Lane Markings -->
    <path
      d="M 22 56 C 21 68, 32 82, 54 84 C 64 85, 76 81, 86 75"
      stroke="#FFFFFF"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-dasharray="6 6"
      fill="none"
    />

    <!-- Speed Lines behind truck -->
    <line x1="20" y1="41" x2="38" y2="41" stroke="#E2E8F0" stroke-width="2.4" stroke-linecap="round" />
    <line x1="16" y1="46" x2="36" y2="46" stroke="#E2E8F0" stroke-width="2.6" stroke-linecap="round" />
    <line x1="21" y1="51" x2="39" y2="51" stroke="#E2E8F0" stroke-width="2.4" stroke-linecap="round" />
    <line x1="26" y1="56" x2="41" y2="56" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round" />

    <!-- Delivery Truck (White on Dark Navy) -->
    <g transform="translate(37, 36)">
      <rect x="4" y="0" width="26" height="16" rx="1.5" fill="#FFFFFF" />
      <line x1="10" y1="2" x2="10" y2="14" stroke="#083091" stroke-width="1" opacity="0.3" />
      <line x1="16" y1="2" x2="16" y2="14" stroke="#083091" stroke-width="1" opacity="0.3" />
      <line x1="22" y1="2" x2="22" y2="14" stroke="#083091" stroke-width="1" opacity="0.3" />
      <path d="M 30 5 L 37 5 C 38.5 5, 40 6.5, 41 8.5 L 43 12.5 C 43.5 13.5, 43.5 16, 42.5 16 L 30 16 Z" fill="#FFFFFF" />
      <path d="M 33 7 L 37 7 C 37.8 7, 38.8 7.8, 39.4 9 L 40.5 11.5 L 33 11.5 Z" fill="#083091" />
      <rect x="42" y="13.5" width="2" height="2" rx="0.5" fill="#FF7A00" />
      <circle cx="11" cy="16.5" r="3.8" fill="#071E34" stroke="#FFFFFF" stroke-width="1.2" />
      <circle cx="11" cy="16.5" r="1.5" fill="#FFFFFF" />
      <circle cx="36" cy="16.5" r="3.8" fill="#071E34" stroke="#FFFFFF" stroke-width="1.2" />
      <circle cx="36" cy="16.5" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- 2. Wordmark: CHOWRA (White) -->
  <text x="145" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="50" fill="#FFFFFF" letter-spacing="1">CHOWR</text>
  
  <!-- Letter A with Orange Triangle -->
  <g transform="translate(374, 23)">
    <text x="0" y="43" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="50" fill="#FFFFFF">A</text>
    <polygon points="16.8,22 8.5,37.5 25.1,37.5" fill="#FF7A00" />
  </g>


  <!-- 3. Subtitle: LOGISTICS AND COURIERS LIMITED (White) -->
  <text x="145" y="92" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="3.2">LOGISTICS AND COURIERS LIMITED</text>

  <!-- 4. Tagline: — Connecting People. Delivering Possibilities. — -->
  <line x1="145" y1="108" x2="170" y2="108" stroke="#FF7A00" stroke-width="2" stroke-linecap="round" />
  <text x="178" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#CBD5E1" font-style="italic">Connecting People. Delivering Possibilities.</text>
  <line x1="424" y1="108" x2="449" y2="108" stroke="#FF7A00" stroke-width="2" stroke-linecap="round" />
</svg>
